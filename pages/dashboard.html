<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Kunang-kunang 22</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="wide">
<div class="container-wide">
  <nav class="navbar">
    <div class="brand">Kunang-kunang <span class="dot">22</span></div>
    <div class="nav-links" id="navLinks">
      <a href="katalog.html">Katalog</a>
      <a href="pesan.html" class="cart-btn">Keranjang <span class="cart-badge" id="cartCount">0</span></a>
      <a href="pesanan-saya.html">Pesanan Saya</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <button id="btnLogout">Keluar</button>
    </div>
  </nav>

  <h1 id="greeting" style="text-align:left;font-size:20px;margin-bottom:4px;">Halo!</h1>
  <p style="color:#888;font-size:13px;margin-bottom:20px;">Kunang-kunang 22</p>

  <div class="user-info" id="userInfo">
    <div class="row"><span class="lbl">Status</span><span class="val"><span id="loading" class="badge">Memuat...</span></span></div>
  </div>

  <div id="adminBadge" style="display:none;background:#fff3cd;color:#856404;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid #ffe69c;">
    <b>Mode Admin/Owner</b> &mdash; Anda bisa kelola pesanan, user, dan produk.
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px;" id="tileGrid">
    <a href="katalog.html" style="text-decoration:none;">
      <div class="produk-card" style="align-items:center;text-align:center;cursor:pointer;">
        <div style="font-size:32px;margin-bottom:6px;">&#128230;</div>
        <div style="font-weight:600;color:#333;">Katalog</div>
        <div style="font-size:11px;color:#888;">Pilih produk</div>
      </div>
    </a>
    <a href="pesan.html" style="text-decoration:none;">
      <div class="produk-card" style="align-items:center;text-align:center;cursor:pointer;">
        <div style="font-size:32px;margin-bottom:6px;">&#128722;</div>
        <div style="font-weight:600;color:#333;">Keranjang</div>
        <div style="font-size:11px;color:#888;" id="cartInfo">0 item</div>
      </div>
    </a>
    <a href="pesanan-saya.html" style="text-decoration:none;">
      <div class="produk-card" style="align-items:center;text-align:center;cursor:pointer;">
        <div style="font-size:32px;margin-bottom:6px;">&#128203;</div>
        <div style="font-weight:600;color:#333;">Pesanan Saya</div>
        <div style="font-size:11px;color:#888;">Riwayat &amp; duplikat</div>
      </div>
    </a>
  </div>

  <button id="btnLogout2" class="btn-secondary">Keluar</button>

  <div class="footer">&copy; 2026 Kunang-kunang 22 &middot; <span id="verApp"></span></div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/cart.js"></script>
<script>
document.getElementById('verApp').textContent = 'v' + KK22_CONFIG.APP_VERSION;
document.getElementById('cartCount').textContent = KK22_CART.count();
document.getElementById('cartInfo').textContent = KK22_CART.count() + ' item';

function buildAdminNav() {
  var navLinks = document.getElementById('navLinks');
  var dashboardLink = navLinks.querySelector('a.active');
  if (!dashboardLink) return;

  var adminPesanan = document.createElement('a');
  adminPesanan.href = 'admin-pesanan.html';
  adminPesanan.textContent = 'Admin Pesanan';

  var adminUsers = document.createElement('a');
  adminUsers.href = 'admin-users.html';
  adminUsers.textContent = 'Admin Users';

  navLinks.insertBefore(adminUsers, dashboardLink);
  navLinks.insertBefore(adminPesanan, adminUsers);
}

function buildAdminTiles() {
  var grid = document.getElementById('tileGrid');
  if (!grid) return;

  var tiles = [
    { href: 'admin-pesanan.html', icon: '&#128203;', label: 'Admin Pesanan', desc: 'Kelola PO, lock item' },
    { href: 'admin-users.html',   icon: '&#128101;', label: 'Admin Users',   desc: 'Kelola akun user' },
    { href: 'admin-produk.html',  icon: '&#127849;', label: 'Admin Produk',  desc: 'Aktif/nonaktif produk' }
  ];

  tiles.forEach(function(t) {
    var a = document.createElement('a');
    a.href = t.href;
    a.style.textDecoration = 'none';
    a.innerHTML =
      '<div class="produk-card" style="align-items:center;text-align:center;cursor:pointer;">' +
        '<div style="font-size:32px;margin-bottom:6px;">' + t.icon + '</div>' +
        '<div style="font-weight:600;color:#333;">' + t.label + '</div>' +
        '<div style="font-size:11px;color:#888;">' + t.desc + '</div>' +
      '</div>';
    grid.appendChild(a);
  });
}

async function init() {
  var token = KK22_API.getToken();
  if (!token) { window.location.href = 'login.html'; return; }

  var r = await KK22_API.whoami();
  if (!r.ok) { KK22_API.clearAuth(); window.location.href = 'login.html'; return; }

  var u = r.data;
  document.getElementById('greeting').textContent = 'Halo, ' + u.nama_lengkap + '!';

  var roleClass = 'badge badge-' + (u.role === 'owner' ? 'owner' : u.role === 'admin' ? 'admin' : 'reseller');
  var userInfo = document.getElementById('userInfo');
  userInfo.innerHTML =
    '<div class="row"><span class="lbl">ID User</span><span class="val">' + u.id_user + '</span></div>' +
    '<div class="row"><span class="lbl">Nama</span><span class="val">' + u.nama_lengkap + '</span></div>' +
    '<div class="row"><span class="lbl">No HP</span><span class="val">' + u.no_hp + '</span></div>' +
    '<div class="row"><span class="lbl">Role</span><span class="val"><span class="' + roleClass + '">' + u.role + '</span></span></div>' +
    (u.id_reseller ? '<div class="row"><span class="lbl">ID Reseller</span><span class="val">' + u.id_reseller + '</span></div>' : '');

  if (u.role === 'owner' || u.role === 'admin') {
    document.getElementById('adminBadge').style.display = 'block';
    buildAdminNav();
    buildAdminTiles();
  }
}

async function doLogout() {
  if (!confirm('Keluar dari akun?')) return;
  await KK22_API.logout();
  window.location.href = 'login.html';
}
document.getElementById('btnLogout').addEventListener('click', doLogout);
document.getElementById('btnLogout2').addEventListener('click', doLogout);

init();
</script>
</body>
</html>
