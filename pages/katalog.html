<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk - Kunang-kunang 22</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="wide">
<div class="container-wide">
  <nav class="navbar">
    <div class="brand">Kunang-kunang <span class="dot">22</span></div>
    <div class="nav-links">
      <a href="katalog.html" class="active">Katalog</a>
      <a href="pesan.html" class="cart-btn">Keranjang <span class="cart-badge" id="cartCount">0</span></a>
      <a href="dashboard.html">Dashboard</a>
      <button id="btnLogout">Keluar</button>
    </div>
  </nav>

  <div class="search-bar">
    <input type="text" id="q" placeholder="Cari produk..." autocomplete="off">
    <button id="btnSearch">Cari</button>
    <button id="btnRefresh" class="btn-secondary">Refresh</button>
  </div>

  <div class="filter-row">
    <label><input type="checkbox" id="hideStok0" checked> Sembunyikan stok 0</label>
    <span class="count-info" id="countInfo">-</span>
  </div>

  <div id="alertBox" class="alert"></div>

  <div id="produkWrap">
    <div class="empty-state"><span class="spinner"></span> Memuat produk...</div>
  </div>

  <div class="footer">&copy; 2026 Kunang-kunang 22 &middot; v<span id="verApp"></span></div>
</div>

<div id="lightbox" class="lightbox" style="display:none;">
  <button class="lightbox-close" id="lightboxClose" type="button">&times;</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/cart.js"></script>
<script>
document.getElementById('verApp').textContent = KK22_CONFIG.APP_VERSION;

(async function() {
  const token = KK22_API.getToken();
  if (!token) { window.location.href = 'login.html'; return; }
  const r = await KK22_API.whoami();
  if (!r.ok) { KK22_API.clearAuth(); window.location.href = 'login.html'; return; }
})();

document.getElementById('btnLogout').addEventListener('click', async function() {
  if (!confirm('Keluar dari akun?')) return;
  await KK22_API.logout();
  window.location.href = 'login.html';
});

var semuaProduk = [];
var lastCached = false;

function rp(n) { return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID'); }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function safeUrl(u) { return String(u || '').replace(/["'\s()<>]/g, ''); }

function updateCartBadge() {
  document.getElementById('cartCount').textContent = KK22_CART.count();
}

function showAlert(msg, type) {
  var b = document.getElementById('alertBox');
  b.className = 'alert alert-' + (type || 'info') + ' show';
  b.textContent = msg;
  clearTimeout(b._t);
  b._t = setTimeout(function() { b.className = 'alert'; }, 3000);
}

function openLightbox(url, caption) {
  if (!url) return;
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lightboxImg');
  var cap = document.getElementById('lightboxCaption');
  if (!lb || !img) return;
  img.src = url;
  cap.textContent = caption || '';
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lightboxImg');
  if (!lb) return;
  lb.style.display = 'none';
  if (img) img.src = '';
  document.body.style.overflow = '';
}

(function initLightbox() {
  var lb = document.getElementById('lightbox');
  if (!lb) return;
  lb.addEventListener('click', function(e) {
    if (e.target.id === 'lightbox' || e.target.id === 'lightboxClose') {
      closeLightbox();
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lb.style.display !== 'none') closeLightbox();
  });
})();

function renderProduk() {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var hideStok0 = document.getElementById('hideStok0').checked;
  var stok0Count = semuaProduk.filter(function(p) {
    return (Number(p.stok_available) || 0) <= 0;
  }).length;
  var filtered = semuaProduk.filter(function(p) {
    if (q && String(p.nama_produk || '').toLowerCase().indexOf(q) === -1) return false;
    if (hideStok0 && (Number(p.stok_available) || 0) <= 0) return false;
    return true;
  });

  var info = filtered.length + ' dari ' + semuaProduk.length + ' produk';
  if (hideStok0 && stok0Count > 0) info += ' (' + stok0Count + ' stok 0 disembunyikan)';
  if (lastCached) info += ' \u00b7 cache';
  document.getElementById('countInfo').textContent = info;

  var wrap = document.getElementById('produkWrap');
  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="icon">&#128533;</div>Produk tidak ditemukan.</div>';
    return;
  }

  var html = '<div class="produk-grid">';
  for (var i = 0; i < filtered.length; i++) {
    var p = filtered[i];
    var stok = Number(p.stok_available) || 0;
    var stokClass = stok <= 0 ? 'low' : '';
    var imgStyle = p.gambar_url
      ? 'style="background-image:url(' + safeUrl(p.gambar_url) + ')"'
      : '';
    var cartItem = KK22_CART.findItem(p.nama_produk);
    var cartQty = cartItem ? Number(cartItem.qty) : 0;
    var badgeStyle = cartQty > 0 ? '' : ' style="display:none"';
    var badgeHtml = '<span class="qty-badge" data-nama="' + esc(p.nama_produk) + '"' + badgeStyle + '>\u00d7' + cartQty + '</span>';
    var minusDisabled = cartQty > 0 ? '' : ' disabled';

    html +=
      '<div class="produk-card" data-nama="' + esc(p.nama_produk) + '">' +
        '<div class="img" data-nama="' + esc(p.nama_produk) + '" ' + imgStyle + '></div>' +
        '<div class="nama">' + esc(p.nama_produk) + '</div>' +
        '<div class="meta">' + esc(p.satuan || '-') + '</div>' +
        '<div class="harga-row">' +
          '<span class="harga">' + rp(p.harga_jual) + '</span>' +
          badgeHtml +
        '</div>' +
        '<div class="stok ' + stokClass + '">Stok: ' + stok + '</div>' +
        '<div class="actions-row">' +
          '<button class="btn-add" data-nama="' + esc(p.nama_produk) + '">+ Tambah</button>' +
          '<button class="btn-minus" data-nama="' + esc(p.nama_produk) + '"' + minusDisabled + '>\u2212</button>' +
        '</div>' +
      '</div>';
  }
  html += '</div>';
  wrap.innerHTML = html;

  function updateCardQtyUI(card, nama) {
    var badge = card.querySelector('.qty-badge');
    var btnMinus = card.querySelector('.btn-minus');
    var cartItem = KK22_CART.findItem(nama);
    var q = cartItem ? Number(cartItem.qty) : 0;
    if (badge) {
      badge.textContent = '\u00d7' + q;
      badge.style.display = q > 0 ? '' : 'none';
    }
    if (btnMinus) btnMinus.disabled = q <= 0;
  }

  wrap.querySelectorAll('.btn-add').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var nama = btn.dataset.nama;
      var produk = semuaProduk.find(function(p) { return p.nama_produk === nama; });
      if (!produk) return;
      KK22_CART.add(produk, 1);
      updateCartBadge();

      var card = btn.closest('.produk-card');
      updateCardQtyUI(card, nama);

      btn.classList.add('pulse');
      setTimeout(function() { btn.classList.remove('pulse'); }, 350);
      card.classList.add('added');
      setTimeout(function() { card.classList.remove('added'); }, 400);
      showAlert('+1 ' + nama, 'success');
    });
  });

  wrap.querySelectorAll('.btn-minus').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var nama = btn.dataset.nama;
      var cartItem = KK22_CART.findItem(nama);
      if (!cartItem) return;
      var newQty = Number(cartItem.qty) - 1;
      var card = btn.closest('.produk-card');
      if (newQty <= 0) {
        KK22_CART.remove(nama);
        showAlert('Dihapus: ' + nama, 'info');
      } else {
        KK22_CART.setQty(nama, newQty);
        showAlert('\u22121 ' + nama, 'info');
      }
      updateCartBadge();
      updateCardQtyUI(card, nama);
    });
  });

  wrap.querySelectorAll('.img').forEach(function(img) {
    img.addEventListener('click', function() {
      var nama = img.dataset.nama;
      var p = semuaProduk.find(function(x) { return x.nama_produk === nama; });
      if (!p || !p.gambar_url) return;
      openLightbox(p.gambar_url, p.nama_produk);
    });
  });
}

async function loadProduk(force) {
  document.getElementById('produkWrap').innerHTML =
    '<div class="empty-state"><span class="spinner"></span> Memuat produk...</div>';
  var r = await KK22_API.getProduk('', force === true);
  if (!r.ok) {
    document.getElementById('produkWrap').innerHTML =
      '<div class="empty-state">Gagal memuat: ' + esc(r.error) + '</div>';
    return;
  }
  semuaProduk = r.data.items || [];
  lastCached = !!r.data._cached;
  renderProduk();
}

document.getElementById('q').addEventListener('input', renderProduk);
document.getElementById('hideStok0').addEventListener('change', renderProduk);
document.getElementById('btnSearch').addEventListener('click', renderProduk);
document.getElementById('btnRefresh').addEventListener('click', async function() {
  KK22_API.clearProdukCache();
  await loadProduk(true);
  showAlert('Produk diperbarui dari server', 'info');
});

updateCartBadge();
loadProduk(false);
</script>
</body>
</html>
